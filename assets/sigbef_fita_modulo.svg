<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="20mm" viewBox="0 0 120 20">
  <!--
    Módulo de repetição para fita de crachá (altura 2 cm = a altura real
    da fita). A gráfica repete este bloco de 120x20 mm ao longo de toda
    a fita.

    O ícone aqui é uma versão SIMPLIFICADA da marca oficial
    (assets/sigbef.svg): a fita costuma ser sublimada/serigrafada, e a
    100% menor que o ícone normal, as barras finas do código de barras e
    as três linhas de texto cinzas viram uma mancha borrada. Ficaram só
    as três formas mais fortes — fundo em gradiente, cabeçalho laranja,
    barras largas — que continuam legíveis a esse tamanho.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E75B6"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </linearGradient>
  </defs>

  <!-- ícone, ocupando a altura toda -->
  <g transform="translate(0,0)">
    <rect width="20" height="20" rx="3.6" ry="3.6" fill="url(#g)"/>
    <g transform="translate(3.7,4)">
      <rect x="0" y="0" width="12.6" height="12" rx="1" ry="1" fill="#FFFFFF"/>
      <rect x="0" y="0" width="12.6" height="2.6" fill="#F2A900"/>
      <!-- barras largas: legiveis a 2cm, ao contrario do codigo de barras real -->
      <g transform="translate(1.4,7.6)">
        <rect width="1.6" height="3.4" fill="#1F4E79"/>
        <rect x="2.6" width="1.0" height="3.4" fill="#1F4E79"/>
        <rect x="4.6" width="2.2" height="3.4" fill="#1F4E79"/>
        <rect x="8.0" width="1.0" height="3.4" fill="#1F4E79"/>
        <rect x="10.0" width="1.6" height="3.4" fill="#1F4E79"/>
      </g>
    </g>
  </g>

  <!-- nome -->
  <text x="26" y="14.5" font-family="Segoe UI, Arial, sans-serif"
        font-weight="800" font-size="10.5" fill="#1F4E79" letter-spacing="0.1">SIGBEF</text>
</svg>
