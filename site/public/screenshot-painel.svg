<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="900" fill="#F5F7FA"/>

  <!-- Cabeçalho -->
  <rect width="1280" height="64" fill="#1F4E79"/>
  <text x="24" y="40" fill="#FFFFFF" font-size="22" font-weight="700">SIGBEF</text>
  <text x="126" y="40" fill="#B7CCE5" font-size="14">Sistema Integrado de Gestão da Biblioteca</text>
  <rect x="936" y="16" width="66" height="32" rx="4" fill="#2E75B6"/>
  <text x="969" y="37" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Sair</text>
  <text x="1256" y="30" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">Administrador do Sistema</text>
  <text x="1256" y="49" fill="#B7CCE5" font-size="11" text-anchor="end">Administrador • matrícula admin</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="240" height="836" fill="#1F4E79"/>
  <g fill="#FFFFFF" font-size="15" font-weight="600">
    <text x="24" y="112">Painel inicial</text>
    <text x="24" y="168">Livros e exemplares</text>
    <text x="24" y="224">Usuários</text>
    <text x="24" y="280">Empréstimos abertos</text>
    <text x="24" y="336">Relatórios</text>
    <text x="24" y="392">Configurações</text>
  </g>

  <!-- Conteúdo -->
  <text x="270" y="128" fill="#1F4E79" font-size="30" font-weight="700">Olá, Administrador!</text>
  <text x="270" y="156" fill="#6B7280" font-size="14">Bem-vindo(a) ao SIGBEF. Use o menu lateral para acessar as funcionalidades.</text>

  <!-- Cards de stats -->
  <g>
    <rect x="270" y="182" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="290" y="212" fill="#6B7280" font-size="13">Títulos no acervo</text>
    <text x="290" y="272" fill="#1F4E79" font-size="40" font-weight="700">11</text>

    <rect x="605" y="182" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="625" y="212" fill="#6B7280" font-size="13">Exemplares totais</text>
    <text x="625" y="272" fill="#1F4E79" font-size="40" font-weight="700">32</text>

    <rect x="940" y="182" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="960" y="212" fill="#6B7280" font-size="13">Disponíveis agora</text>
    <text x="960" y="272" fill="#1F4E79" font-size="40" font-weight="700">24</text>

    <rect x="270" y="316" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="290" y="346" fill="#6B7280" font-size="13">Empréstimos abertos</text>
    <text x="290" y="406" fill="#1F4E79" font-size="40" font-weight="700">5</text>

    <rect x="605" y="316" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="625" y="346" fill="#6B7280" font-size="13">Em atraso</text>
    <text x="625" y="406" fill="#1F4E79" font-size="40" font-weight="700">5</text>

    <rect x="940" y="316" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="960" y="346" fill="#6B7280" font-size="13">Usuários ativos</text>
    <text x="960" y="406" fill="#1F4E79" font-size="40" font-weight="700">6</text>
  </g>

  <!-- Top 10 -->
  <text x="270" y="484" fill="#1F4E79" font-size="19" font-weight="700">Top 10 livros mais emprestados</text>
  <rect x="270" y="502" width="990" height="44" fill="#1F4E79"/>
  <text x="290" y="530" fill="#FFFFFF" font-size="13" font-weight="700">Título</text>
  <text x="1145" y="530" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Empréstimos</text>
  <g font-size="13">
    <rect x="270" y="546" width="990" height="36" fill="#FFFFFF"/>
    <text x="290" y="569">1984</text>
    <text x="1145" y="569" text-anchor="middle">2</text>

    <rect x="270" y="582" width="990" height="36" fill="#F8FAFC"/>
    <text x="290" y="605">Python Fluente</text>
    <text x="1145" y="605" text-anchor="middle">1</text>

    <rect x="270" y="618" width="990" height="36" fill="#FFFFFF"/>
    <text x="290" y="641">Algoritmos: Teoria e Prática</text>
    <text x="1145" y="641" text-anchor="middle">1</text>

    <rect x="270" y="654" width="990" height="36" fill="#F8FAFC"/>
    <text x="290" y="677">Dom Casmurro</text>
    <text x="1145" y="677" text-anchor="middle">1</text>
  </g>
  <rect x="270" y="546" width="990" height="144" fill="none" stroke="#E3E7EC"/>
</svg>
