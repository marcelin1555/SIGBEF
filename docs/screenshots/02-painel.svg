<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="780" fill="#F5F7FA"/>

  <!-- Cabeçalho -->
  <rect width="1280" height="60" fill="#1F4E79"/>
  <text x="20" y="38" fill="#FFFFFF" font-size="22" font-weight="700">SIGBEF</text>
  <text x="120" y="38" fill="#B7CCE5" font-size="14">Sistema Integrado de Gestão da Biblioteca</text>
  <text x="1180" y="32" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">Maria Bibliotecária</text>
  <text x="1180" y="50" fill="#B7CCE5" font-size="11" text-anchor="end">Bibliotecario • matrícula bibliotecaria</text>
  <rect x="1200" y="18" width="60" height="26" fill="#2E75B6"/>
  <text x="1230" y="36" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Sair</text>

  <!-- Sidebar -->
  <rect x="0" y="60" width="240" height="720" fill="#1F4E79"/>
  <rect x="0" y="60" width="240" height="50" fill="#2E75B6"/>
  <text x="20" y="92" fill="#FFFFFF" font-size="14" font-weight="700">Painel inicial</text>
  <g fill="#FFFFFF" font-size="14">
    <text x="20" y="142">Livros e exemplares</text>
    <text x="20" y="192">Usuários</text>
    <text x="20" y="242">Empréstimos abertos</text>
    <text x="20" y="292">Relatórios</text>
  </g>

  <!-- Conteúdo -->
  <text x="270" y="100" fill="#1F4E79" font-size="28" font-weight="700">Olá, Maria!</text>
  <text x="270" y="125" fill="#6B7280" font-size="13">Bem-vindo(a) ao SIGBEF. Use o menu lateral para acessar as funcionalidades.</text>

  <!-- Cards de stats -->
  <g>
    <rect x="270" y="150" width="320" height="120" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="290" y="180" fill="#6B7280" font-size="13">Títulos no acervo</text>
    <text x="290" y="240" fill="#1F4E79" font-size="40" font-weight="700">10</text>

    <rect x="600" y="150" width="320" height="120" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="620" y="180" fill="#6B7280" font-size="13">Exemplares totais</text>
    <text x="620" y="240" fill="#2E75B6" font-size="40" font-weight="700">28</text>

    <rect x="930" y="150" width="320" height="120" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="950" y="180" fill="#6B7280" font-size="13">Disponíveis agora</text>
    <text x="950" y="240" fill="#2E7D32" font-size="40" font-weight="700">25</text>

    <rect x="270" y="280" width="320" height="120" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="290" y="310" fill="#6B7280" font-size="13">Empréstimos abertos</text>
    <text x="290" y="370" fill="#F2A900" font-size="40" font-weight="700">3</text>

    <rect x="600" y="280" width="320" height="120" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="620" y="310" fill="#6B7280" font-size="13">Em atraso</text>
    <text x="620" y="370" fill="#C62828" font-size="40" font-weight="700">0</text>

    <rect x="930" y="280" width="320" height="120" fill="#FFFFFF" stroke="#D5DAE0"/>
    <text x="950" y="310" fill="#6B7280" font-size="13">Usuários ativos</text>
    <text x="950" y="370" fill="#2E75B6" font-size="40" font-weight="700">5</text>
  </g>

  <!-- Top 10 -->
  <text x="270" y="450" fill="#2E75B6" font-size="18" font-weight="700">Top 10 livros mais emprestados</text>
  <rect x="270" y="468" width="980" height="46" fill="#1F4E79"/>
  <text x="290" y="497" fill="#FFFFFF" font-size="13" font-weight="700">Título</text>
  <text x="1140" y="497" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Empréstimos</text>
  <g font-size="13">
    <rect x="270" y="514" width="980" height="34" fill="#FFFFFF"/>
    <text x="290" y="535">Dom Casmurro</text>
    <text x="1140" y="535" text-anchor="middle">3</text>
    <rect x="270" y="548" width="980" height="34" fill="#F8FAFC"/>
    <text x="290" y="569">1984</text>
    <text x="1140" y="569" text-anchor="middle">2</text>
    <rect x="270" y="582" width="980" height="34" fill="#FFFFFF"/>
    <text x="290" y="603">Cálculo - Volume 1</text>
    <text x="1140" y="603" text-anchor="middle">2</text>
    <rect x="270" y="616" width="980" height="34" fill="#F8FAFC"/>
    <text x="290" y="637">Algoritmos: Teoria e Prática</text>
    <text x="1140" y="637" text-anchor="middle">1</text>
    <rect x="270" y="650" width="980" height="34" fill="#FFFFFF"/>
    <text x="290" y="671">Python Fluente</text>
    <text x="1140" y="671" text-anchor="middle">1</text>
  </g>
</svg>
